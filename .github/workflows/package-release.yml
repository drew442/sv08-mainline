name: Package and release regressions

on:
  pull_request:
    branches: [main]
    paths: &inputs
      - '.github/workflows/package-release.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'configs/**'
      - 'patches/**'
      - 'runtime/**'
      - 'ui/**'
      - 'extensions/**'
      - 'upstream/**'
      - '.gitmodules'
      - 'upstream-lock.json'
      - 'LICENSE*'
      - 'LICENSING*'
      - 'docs/**'
  push:
    branches: [main]
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Initialize failure evidence
        run: |
          mkdir -p "$RUNNER_TEMP/package-release-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/package-release-evidence/source-revision.txt"
          echo 'FAIL: input preparation or test runner did not complete' > "$RUNNER_TEMP/package-release-evidence/summary.txt"
      - name: Fetch and verify exact bounded public test input
        shell: bash
        run: |
          set -euo pipefail
          bash -euo pipefail <<'PREP' 2>&1 | tail -c 131072 > "$RUNNER_TEMP/package-release-evidence/fixture-preparation.log"
          curl --fail --location --max-time 60 --max-filesize 1048576 --output "$RUNNER_TEMP/gcodeviewer-3.7.18.tgz" 'https://registry.npmjs.org/@sindarius/gcodeviewer/-/gcodeviewer-3.7.18.tgz'
          python3 - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          record = json.loads(Path('configs/host/npm-standard-license-texts.json').read_text())['records'][0]
          raw = (Path(os.environ['RUNNER_TEMP']) / 'gcodeviewer-3.7.18.tgz').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == record['archive_sha256'], 'supplier SHA256 mismatch'
          assert 'sha512-' + base64.b64encode(hashlib.sha512(raw).digest()).decode() == record['integrity'], 'supplier SRI mismatch'
          PY
          PREP
      - name: Prepare only pinned public Mainsail source
        shell: bash
        run: |
          set -euo pipefail
          bash -euo pipefail <<'PREP' 2>&1 | tail -c 131072 > "$RUNNER_TEMP/package-release-evidence/mainsail-preparation.log"
          git submodule update --init --depth 1 -- upstream/mainsail
          PREP
      - name: Run deterministic offline package and release gates
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          TMPDIR: ${{ runner.temp }}
          SV08_GCODEVIEWER_ARCHIVE: ${{ runner.temp }}/gcodeviewer-3.7.18.tgz
        run: python3 scripts/check_package_release.py --output "$RUNNER_TEMP/package-release-evidence"
      - name: Retain bounded regression evidence even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-release-evidence/
          if-no-files-found: error
          retention-days: 7
