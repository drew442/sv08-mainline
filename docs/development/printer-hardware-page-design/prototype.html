<script>
const I=(name)=>`<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
let advanced=false, tableMode=false, diffMode=false, saved=false;
const cards=[
{key:'bed',icon:'bed',title:'Bed & build surface',selection:'Funssor / CN3D complete bed',sub:'Replacement heater and temperature sensor',badge:'Needs sensor',cls:'warn',changed:true,meta:'Changed from stock',action:'Configure'},
{key:'probe',icon:'probe',title:'Probe & levelling',selection:'BTT Eddy USB',sub:'Bed probing and levelling behaviour',badge:'Needs connection',cls:'warn',changed:true,meta:'Changed from stock',action:'Configure'},
{key:'toolhead',icon:'nozzle',title:'Toolhead & extrusion',selection:'Stock SV08 toolhead',sub:'Hotend, extruder and part-cooling fans',badge:'Stock',cls:'',meta:'Stock configuration',action:'Change'},
{key:'filament',icon:'spool',title:'Filament & multi-colour',selection:'Single filament',sub:'Feeders, tool changes and runout sensing',badge:'Stock',cls:'',meta:'Explore upgrade definitions',action:'Change'},
{key:'boards',icon:'board',title:'Boards & connections',selection:'SV08 mainboard + toolhead board',sub:'Controller revisions and device connections',badge:'2 controllers',cls:'',meta:'Original board references',action:'Configure'},
{key:'cooling',icon:'fan',title:'Cooling & enclosure',selection:'Stock cooling · no chamber heater',sub:'Exhaust, enclosure fans and chamber heating',badge:'Stock',cls:'',meta:'Add or replace a component',action:'Change'}];
function header(active){return `<div class="page-heading"><div><p class="eyebrow">YOUR PRINTER</p><h1>Printer hardware</h1><p>Describe the parts fitted to your printer. Presets prepare the matching configuration.</p><div class="context"><strong>Sovol SV08</strong><span class="vbar"></span><span>Original mainboard & toolhead board</span><span class="vbar"></span><span class="runtime">Live configuration unchanged</span></div></div><div class="page-tools"><button data-history>${I('updates')} History</button></div></div><div class="tabs" role="tablist" aria-label="Printer hardware views"><button role="tab" aria-selected="${active==='components'}" class="${active==='components'?'active':''}" data-route="components">Components</button><button role="tab" aria-selected="${active==='connections'}" class="${active==='connections'?'active':''}" data-route="connections">Connections</button><button role="tab" aria-selected="${active==='changes'}" class="${active==='changes'?'active':''}" data-route="changes">Changes <span class="count">2</span></button><label class="advanced"><input type="checkbox" id="advanced-toggle" ${advanced?'checked':''}>Advanced</label></div>`}
function foot(copy='2 component changes',review=true){return `<div class="footer"><div class="footer-copy"><strong>${saved?'Selections saved':copy}</strong><span>Not applied to the printer. You can save incomplete selections.</span></div><button data-save>Save selections</button><button class="primary" data-route="${review?'changes':'components'}">${review?'Review changes':'Back to components'} ${I('chevron')}</button></div><div class="footnote"><span>Preset values are kept separate from your overrides and calibration.</span><span>Offline prototype · no printer actions</span></div>`}
function card(c){return `<article class="component ${c.changed?'changed':''}"><div class="component-top"><span class="icon-box">${I(c.icon)}</span><h3>${c.title}</h3><span class="badge ${c.cls}">${c.badge}</span></div><p class="selection">${c.selection}</p><p class="subtext">${c.sub}</p><div class="component-bottom"><span class="smalltext muted">${c.meta}</span><button class="link" data-component="${c.key}">${c.action} ${I('chevron')}</button></div></article>`}
function components(){return header('components')+`<div class="notice">${I('info')}<div><strong>2 components need details</strong> — complete bed and probe setup. Save your choices at any time.</div><button class="link notice-end" data-route="bed">Complete details ${I('chevron')}</button></div><div class="section-heading"><h2>Your components</h2><span>Choose a preset, then adjust only what is different.</span></div><div class="cards">${cards.map(card).join('')}</div>${advanced?`<div class="advanced-hint">${I('settings')}Advanced is on. Open a component to edit preset values, connections or owned configuration sections.</div>`:''}`+foot()}
function list(){return `<div class="selection-column"><div class="section-heading"><h2>Your components</h2></div><div class="selected-list">${cards.map(c=>`<div class="list-item ${c.key==='bed'?'selected':''}" role="button" tabindex="0" data-component="${c.key}"><span class="icon-box">${I(c.icon)}</span><div><h3>${c.title}</h3><p>${c.selection}</p>${c.changed?`<span class="badge ${c.cls}">${c.badge}</span>`:''}</div>${I('chevron')}</div>`).join('')}</div><div class="selection-help"><strong>A preset is a starting point, not a lock.</strong>Keep the documented defaults, or change a connection or setting in Advanced. Your overrides remain attached to this preset.</div></div>`}
function bed(){return header('components')+`<button class="link back-button" data-route="components">${I('undo')} All components</button><div class="detail-layout">${list()}<aside class="detail-aside" aria-label="Bed configuration"><div class="drawer-head"><div><p class="eyebrow">BED & BUILD SURFACE</p><h2>Funssor / CN3D complete bed</h2></div><button class="icon-button" data-route="components" aria-label="Close component details">${I('close')}</button></div><div class="drawer-body"><span class="badge warn">Partial preset · sensor required</span><p>The kit selection is saved with its documented defaults. Identify the fitted sensor to finish this setup.</p><label class="field">Installed bed<select><option>Funssor / CN3D complete SV08 bed</option><option>Stock SV08 heated bed</option><option>Custom heated bed…</option></select></label><label class="field">Supplied temperature sensor<select class="needs-input" id="sensor-choice"><option value="">Choose the sensor fitted to your kit…</option><option>Generic 3950 — only if identified</option><option>EPCOS 100K B57560G104F — only if identified</option><option>PT1000 — only if identified</option><option>Custom sensor definition…</option></select><small>The kit page does not identify the sensor. Do not reuse the stock curve automatically.</small></label><label class="field">Connection<select><option>Original SV08 bed connections</option><option>Custom connection — open Connections…</option></select><small>Heater and sensor are mapped separately.</small></label><h3 class="mini-title">What this preset changes</h3><div class="setting-row"><span>Bed maximum temperature</span><strong>105 °C retained <span class="muted smalltext">(existing setting)</span></strong></div><div class="setting-row"><span>Levelling wait behaviour</span><strong class="warntext">Needs a verified bed + probe rule</strong></div><div class="setting-row"><span>Stock thermistor curve</span><strong>Removed · replacement required</strong></div><div class="setting-row"><span>Bed PID calibration</span><strong>Needs recalibration</strong></div><div class="inline-info">A product’s advertised heating temperature is not automatically its Klipper safety cutoff. No new temperature is assumed here.</div><details ${advanced?'open':''}><summary>Advanced · connections & preset overrides</summary><div class="advanced-edit"><label class="field">Bed sensor input<div class="readfield mono">main:PC5 · reference mapping</div></label><button class="link" data-route="connections">${I('link')} Edit connection</button><label class="field">Override ownership<select><option>Keep preset-managed settings</option><option>Create a structured override</option><option>Manage a section as custom configuration…</option></select></label><p>Custom settings retain the preset, original value and source. They do not silently replace unrelated files.</p></div></details><details><summary>Build guide & definition sources</summary><p>Funssor complete-bed product page; project named-upgrade evidence at main 11912e05. Supplied sensor and levelling rule remain unresolved. Source detail belongs here, not on every card.</p></details></div><div class="drawer-actions"><button data-route="components">Back</button><button class="primary" data-save>Save selections</button></div></aside></div><div class="footnote"><span>Selection and calibration are separate. Saving does not heat, move or restart the printer.</span><span>Offline prototype</span></div>`}
function probe(){return header('components')+`<div class="detail-layout">${list()}<aside class="detail-aside"><div class="drawer-head"><div><p class="eyebrow">PROBE & LEVELLING</p><h2>BTT Eddy</h2></div><button class="icon-button" data-route="components" aria-label="Close">${I('close')}</button></div><div class="drawer-body"><span class="badge warn">Needs connection</span><p>Select the exact product variant. Connection types and calibration requirements belong to that definition.</p><label class="field">Product variant<select><option>BTT Eddy USB</option><option>BTT Eddy Coil (I²C)</option><option>Other Eddy model — exact definition required</option></select></label><label class="field">USB device<select><option>Choose a detected MCU…</option><option>Enter a private device identity…</option></select><small>No device discovery is performed by this prototype.</small></label><h3 class="mini-title">Prepared by the definition</h3><div class="setting-row"><span>Probe configuration</span><strong>Eddy USB-specific</strong></div><div class="setting-row"><span>Levelling behaviour</span><strong>Resolve with selected bed</strong></div><div class="setting-row"><span>Stock probe ownership</span><strong>Review replacement</strong></div><div class="setting-row"><span>Calibration</span><strong>Required for fitted sensor</strong></div><div class="inline-info">A USB probe is not assigned to an arbitrary mainboard probe pin. Coil/I²C, CAN and USB are different connection models.</div><details><summary>Advanced · offsets & behaviour overrides</summary><p>Offsets, compatible homing methods and calibration are explicit values; none are invented from the product name.</p></details><details><summary>Build guide & definition sources</summary><p>BIGTREETECH Eddy guide and upstream Klipper Eddy documentation. Version support must be checked against the project’s pinned Klipper before enabling this preset.</p></details></div><div class="drawer-actions"><button data-route="components">Back</button><button class="primary" data-save>Save selections</button></div></aside></div>`}
const diagram=`<svg class="diagram" viewBox="0 0 620 420" role="img" aria-label="Logical connections from board through header and MCU signal to device; contact numbers are unknown"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#859bb0" stroke-width="1.6"/></marker></defs><text class="col-label" x="13" y="30">BOARD</text><text class="col-label" x="173" y="30">HEADER</text><text class="col-label" x="329" y="30">MCU SIGNAL</text><text class="col-label" x="461" y="30">DEVICE</text><path class="wire selected" d="M135 138H153V91H171"/><path class="wire" d="M135 138H153V205H171"/><path class="wire selected" d="M305 91H328"/><path class="wire selected" d="M429 91H455"/><path class="wire" d="M305 205H328M429 205H455"/><path class="wire" d="M135 335H171M305 335H328M429 335H455"/>
<rect class="node" x="8" y="96" width="127" height="83" rx="7"/><text class="node-title" x="22" y="122">SV08 mainboard</text><text class="node-small" x="22" y="143">Original reference</text><text class="signal" x="22" y="162">main</text>
<rect class="node chosen" x="171" y="60" width="134" height="63" rx="7"/><text class="node-title" x="184" y="84">Bed thermistor</text><text class="node-small" x="184" y="105">Contact: unknown</text>
<rect class="node chosen" x="328" y="69" width="101" height="45" rx="6"/><text class="signal" x="345" y="96">main:PC5</text>
<rect class="node chosen" x="455" y="60" width="157" height="63" rx="7"/><text class="node-title" x="468" y="85">Bed sensor</text><text class="node-small" x="468" y="105">Sensor type needed</text>
<rect class="node" x="171" y="174" width="134" height="63" rx="7"/><text class="node-title" x="184" y="198">Bed heater output</text><text class="node-small" x="184" y="219">Contact: unknown</text>
<rect class="node" x="328" y="183" width="101" height="45" rx="6"/><text class="signal" x="345" y="210">main:PA0</text>
<rect class="node" x="455" y="174" width="157" height="63" rx="7"/><text class="node-title" x="468" y="198">Bed heater control</text><text class="node-small" x="468" y="219">Not a mains diagram</text>
<path d="M8 276H612" stroke="#e2e8f0" stroke-dasharray="4 5"/>
<rect class="node" x="8" y="304" width="127" height="63" rx="7"/><text class="node-title" x="22" y="330">SV08 toolboard</text><text class="node-small" x="22" y="351">tool · reference</text>
<rect class="node" x="171" y="304" width="134" height="63" rx="7"/><text class="node-title" x="184" y="330">TH</text><text class="node-small" x="184" y="351">Contact: unknown</text>
<rect class="node" x="328" y="313" width="101" height="45" rx="6"/><text class="signal" x="345" y="340">tool:PA5</text>
<rect class="node" x="455" y="304" width="157" height="63" rx="7"/><text class="node-title" x="468" y="330">Hotend sensor</text><text class="node-small" x="468" y="351">Stock configuration</text></svg>`;
function connections(){return header('connections')+`<div class="toolbar"><div><h2>Connections</h2><p>Follow a device from its controller to its connector and signal.</p></div><div class="segmented"><button class="${!tableMode?'active':''}" data-view="map">Logical map</button><button class="${tableMode?'active':''}" data-view="table">Connection table</button></div></div><div class="connection-layout"><div><div class="diagram-card"><div class="diagram-caption"><strong>Controller reference mappings</strong><span class="badge outline">Not a physical pinout</span></div>${tableMode?`<div class="connection-table-wrap"><table class="connection-table"><thead><tr><th>Board</th><th>Header</th><th>Contact</th><th>Signal</th><th>Device</th></tr></thead><tbody><tr><td>SV08 main</td><td>Bed thermistor</td><td>Unknown</td><td class="mono">main:PC5</td><td>Bed sensor</td></tr><tr><td>SV08 main</td><td>Bed output</td><td>Unknown</td><td class="mono">main:PA0</td><td>Bed heater control</td></tr><tr><td>SV08 tool</td><td>TH</td><td>Unknown</td><td class="mono">tool:PA5</td><td>Hotend sensor</td></tr></tbody></table></div>`:`<div class="diagram-scroll">${diagram}</div>`}<div class="diagram-legend"><span><span class="legend-line"></span>Selected connection</span><span><span class="legend-line neutral"></span>Reference mapping</span></div></div><div class="diagram-card inventory"><h3>Other connection types</h3><div class="inventory-row">${I('probe')}<div><strong>BTT Eddy USB</strong><br><span class="muted">Linux host → USB → Eddy controller → probe</span></div><span class="badge warn last">Choose USB device</span></div><div class="inventory-row">${I('info')}<span class="muted">USB and CAN use controller identities. I²C uses a bus and address, not a single “probe pin”.</span></div></div><div class="advanced-hint">${I('info')}This view documents connections; it does not detect wiring or verify electrical safety.</div></div><aside class="inspector"><p class="eyebrow">SELECTED DEVICE</p><h3>Bed temperature sensor</h3><span class="badge teal">Preset connection</span><label class="field">Board<select><option>Sovol SV08 mainboard</option><option>Choose another board…</option></select></label><label class="field">Header<select><option>Heated bed thermistor</option><option>Choose a documented alternative…</option></select></label><label class="field">Controller signal<div class="readfield mono">main:PC5</div><small>Derived from the selected board reference.</small></label><label class="field">Connector contact<div class="readfield">Not documented</div></label><div class="notice">${I('info')}<span>Contact number and orientation are unknown. A physical wiring diagram is unavailable for this reference.</span></div><button class="wide" data-demo="Production: show only compatible, documented connectors for this board. Missing board definitions require an explicit custom profile.">${I('link')} Change connection</button><button class="link" data-source>${I('external')} View mapping source</button></aside></div>`+foot('Connection preview · 2 component changes')}
function changes(){return header('changes')+`<div class="toolbar"><div><h2>Review changes</h2><p>Check the effects on configuration and macros before anything is applied.</p></div><span class="badge outline">Live files unchanged</span></div><div class="notice">${I('info')}<div><strong>Selections can be saved. Configuration is not ready yet.</strong><br>Complete the missing details below before generating a full configuration.</div></div><div class="review-layout"><section class="table-card"><div class="review-mini-tabs"><button class="${!diffMode?'active':''}" data-diff="summary">Summary</button><button class="${diffMode?'active':''}" data-diff="files">Files & diff</button></div>${diffMode?fileplan():`<div class="review-item"><div class="title-line">${I('bed')}Bed & build surface<span class="badge warn">Needs sensor</span></div><div class="before-after"><div><span class="caption">CURRENT</span>Stock SV08 heated bed</div>${I('chevron')}<div><span class="caption">SELECTED</span>Funssor / CN3D complete bed</div></div><div class="impact">${I('settings')}<span>Replace the stock sensor curve after the supplied sensor is identified.</span></div><div class="impact">${I('settings')}<span>Clear stock bed PID values; record that calibration is needed.</span></div><div class="impact">${I('info')}<span>Retain the existing 105 °C cutoff. No higher limit is inferred.</span></div></div><div class="review-item"><div class="title-line">${I('probe')}Probe & levelling<span class="badge warn">Needs connection</span></div><div class="before-after"><div><span class="caption">CURRENT</span>Stock SV08 probe</div>${I('chevron')}<div><span class="caption">SELECTED</span>BTT Eddy USB</div></div><div class="impact">${I('settings')}<span>Prepare the Eddy-specific probe and controller configuration.</span></div><div class="impact">${I('settings')}<span>Resolve the levelling wait rule from the bed and probe combination.</span></div><div class="impact">${I('info')}<span>Do not copy calibration from the old probe.</span></div></div><div class="review-item"><div class="title-line">${I('file')}Configuration ownership</div><div class="impact">${I('check')}<span>Unrelated user files and custom macros remain untouched.</span></div><div class="impact">${I('info')}<span>A full file diff is available after required settings are resolved.</span></div></div>`}</section><aside class="review-aside"><h3>Finish these details</h3><div class="todo"><span class="number">1</span><div><strong>Identify the bed sensor</strong><span class="muted">Required for a valid temperature reading.</span><button class="link" data-route="bed">Open bed settings ${I('chevron')}</button></div></div><div class="todo"><span class="number">2</span><div><strong>Connect Eddy USB</strong><span class="muted">Choose its controller identity.</span><button class="link" data-route="probe">Open probe settings ${I('chevron')}</button></div></div><div class="todo"><span class="number">3</span><div><strong>Complete the preset rule</strong><span class="muted">The bed + probe levelling rule needs a definition update, not a guessed temperature.</span></div></div><div class="rule"><strong>Calibration is a separate step.</strong><br>Hardware selections can be saved now. Generating, applying and commissioning are distinct states.</div></aside></div><div class="footer"><div class="footer-copy"><strong>Review only · no files written</strong><span>2 incomplete components. Your selections are still editable.</span></div><button data-route="components">Back</button><button class="primary" data-save>Save selections</button><button disabled title="Identify the sensor, connection and levelling rule first.">Generate configuration</button></div><div class="footnote"><span>Live apply is a separate future capability. Existing project support saves inactive candidates.</span><span>Offline prototype</span></div>`}

function ready(){return header('changes')+`<div class="toolbar"><div><h2>Review & apply</h2><p>Resolved definitions, saved overrides and the current files have been checked together.</p></div><span class="badge teal">Ready to apply</span></div><div class="notice ready">${I('check')}<div><strong>Configuration checks passed</strong><br>Review the changes below. Applying updates the managed files; it does not start the printer.</div></div><div class="review-layout"><section class="table-card"><div class="review-mini-tabs"><button class="active">Summary</button><button data-demo="This future-state illustration has no generated payload. The implemented UI must display actual file contents and before/after changes.">Files & diff</button></div><div class="review-item"><div class="title-line">${I('bed')}Bed & build surface<span class="badge teal">Definition resolved</span></div><div class="before-after"><div><span class="caption">CURRENT</span>Stock SV08 heated bed</div>${I('chevron')}<div><span class="caption">SELECTED</span>Funssor / CN3D complete bed</div></div><div class="impact">${I('check')}<span>Use the identified sensor and the resolved thermal settings.</span></div><div class="impact">${I('file')}<span>Bed configuration: <span class="mono">hardware/bed.cfg</span></span></div></div><div class="review-item"><div class="title-line">${I('probe')}Probe & levelling<span class="badge teal">Definition resolved</span></div><div class="before-after"><div><span class="caption">CURRENT</span>Stock SV08 probe</div>${I('chevron')}<div><span class="caption">SELECTED</span>BTT Eddy USB</div></div><div class="impact">${I('check')}<span>Use the selected Eddy controller and the resolved bed + probe policy.</span></div><div class="impact">${I('file')}<span>Probe and levelling macros: 2 managed files.</span></div></div><div class="review-item"><div class="title-line">${I('settings')}Your configuration is preserved</div><div class="impact">${I('check')}<span>Custom overrides are included; unrelated macros remain unchanged.</span></div><div class="impact">${I('check')}<span>Previous managed files are retained for restoration.</span></div><div class="impact">${I('info')}<span>Calibration status is checked separately for each changed component.</span></div></div></section><aside class="review-aside"><h3>Apply to printer</h3><div class="todo"><span class="number">1</span><div><strong>Snapshot current files</strong><span class="muted">Keep an exact rollback version.</span></div></div><div class="todo"><span class="number">2</span><div><strong>Write reviewed configuration</strong><span class="muted">Only files included in this plan.</span></div></div><div class="todo"><span class="number">3</span><div><strong>Continue setup separately</strong><span class="muted">Klipper remains stopped. No heating, homing or motion is triggered.</span></div></div><div class="apply-facts"><strong>Printer state</strong><br>Not printing · service stopped<br><br><strong>Before first use</strong><br>Complete any required commissioning and calibration.</div></aside></div><div class="footer"><div class="footer-copy"><strong>2 component changes · 3 managed files</strong><span>No automatic restart, heating or movement.</span></div><button data-route="components">Back</button><button class="primary" data-future-apply>Apply configuration</button></div><div class="footnote"><span>Future-state illustration: assumes completed definitions and valid configuration. Not evidence of hardware compatibility.</span><span>Offline prototype</span></div>`}

function fileplan(){return `<div class="file-plan"><div class="notice info">${I('info')}<span>A complete, validated diff has not been generated. These are proposed output groups, not files written to your printer.</span></div><div class="file-row">${I('file')}<span class="mono">hardware/bed.cfg</span><span class="badge warn">Sensor needed</span></div><div class="file-row">${I('file')}<span class="mono">hardware/probe.cfg</span><span class="badge warn">Connection needed</span></div><div class="file-row">${I('file')}<span class="mono">macros/hardware.cfg</span><span class="badge warn">Rule needed</span></div><pre class="code-preview">No candidate text is emitted for unresolved settings.\n\nNext: resolve the details, generate a candidate,\nthen review actual before / after configuration.</pre></div>`}
function modal(title,copy){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-copy').textContent=copy;document.getElementById('demo-dialog').showModal()}
function toast(text){const t=document.getElementById('toast');t.textContent=text;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',4500)}
function render(){const name=location.hash.replace('#','')||'components';const views={components,bed,probe,connections,changes,ready};document.getElementById('main').innerHTML=(views[name]||components)();bind()}
function route(name){if(location.hash==='#'+name)render();else location.hash=name}
function bind(){document.querySelectorAll('[data-future-apply]').forEach(b=>b.onclick=()=>modal('Future apply workflow','This is an offline, future-state illustration. No file or printer has been changed. Production must recheck the reviewed revision, validate and snapshot the complete output, publish only the managed files, and leave the printer stopped until explicitly started.'));document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>route(b.dataset.route));document.querySelectorAll('[data-component]').forEach(b=>{b.onclick=()=>openComponent(b.dataset.component);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.click()}}});document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>toast(b.dataset.demo));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{saved=true;toast('Prototype only: selections marked saved in memory. No printer, file or browser storage was changed.');});document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>modal('Configuration history','The production view will distinguish saved selections, generated candidates and applied versions. Restoring a version creates a new draft and requires review; it never silently applies old files.'));document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>modal('Mapping source','Reference: project printer hardware catalog at main 11912e05, using pinned Sovol printer.cfg a60644875. Bed sensor PC5, bed heater PA0; connector contact numbers remain unknown. This mapping does not certify installed hardware.'));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{tableMode=b.dataset.view==='table';render()});document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{diffMode=b.dataset.diff==='files';render()});const a=document.getElementById('advanced-toggle');if(a)a.onchange=()=>{advanced=a.checked;render()};const s=document.getElementById('sensor-choice');if(s)s.onchange=()=>toast('Prototype field only. A real sensor selection must resolve a verified definition and invalidate affected calibration.');}
function openComponent(key){if(key==='bed'||key==='probe')route(key);else if(key==='boards')route('connections');else{const options={toolhead:['Toolhead & extrusion','Choose a stock or versioned CN3D toolhead definition. Exact toolhead, extruder, hotend, probe mount and board revisions determine compatible defaults. The brief defines this workflow; no specific CN3D revision has been validated here.'],filament:['Filament & multi-colour','Choose single filament, a versioned multi-colour feeder or a toolchanger bundle. Feeder-based colour changes and multiple toolheads are distinct profiles, with tool counts, macros and dependencies managed together.'],cooling:['Cooling & enclosure','Select individual fans, enclosure devices or a documented chamber-heating module. Output ratings, controller identity and thermal requirements belong to that exact definition.']};modal(...options[key]);}}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
