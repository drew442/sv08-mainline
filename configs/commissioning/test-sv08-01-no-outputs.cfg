# Communication-only commissioning template. Not a printing configuration.
# Replace the two serial placeholders in an ignored local copy.
# No steppers, heaters, fans, probes or output pins are configured.
[mcu]
serial: /dev/serial/by-id/REPLACE_MAINBOARD
restart_method: command

[mcu extra_mcu]
serial: /dev/serial/by-id/REPLACE_TOOLHEAD
restart_method: command

[printer]
kinematics: none
max_velocity: 1
max_accel: 1
