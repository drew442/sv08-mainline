# Input-only include for the paired no-outputs template; no actuation macros.
# Preserved configured pins/polarities, not physically validated associations.
# Do not combine with a printing configuration claiming these pins.
# Inspect objects/query: gcode_button probe_check and gcode_button filament_check.
# Klipper PRESSED/RELEASED labels do not establish physical trigger polarity.
[gcode_button probe_check]
pin: extra_mcu:PB6
press_gcode:
release_gcode:

[gcode_button filament_check]
pin: PE9
press_gcode:
release_gcode:
